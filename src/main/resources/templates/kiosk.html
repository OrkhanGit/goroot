<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giriş/Çıxış QR Ekranı</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #0f172a;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: white;
        }
        h1 {
            font-size: 28px;
            margin-bottom: 30px;
            font-weight: 600;
        }
        #qr-container {
            background: white;
            padding: 24px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.4);
        }
        #status {
            margin-top: 20px;
            font-size: 14px;
            color: #94a3b8;
        }
        #status.error {
            color: #f87171;
        }
    </style>
</head>
<body>

<h1>Ofisə giriş/çıxış üçün QR-ı oxutun</h1>
<div id="qr-container"></div>
<div id="status">Yüklənir...</div>

<script>
    // ============================================================
    // KONFİQURASİYA — özünüzə uyğun dəyişin
    // ============================================================
    const API_BASE_URL = "http://100.89.116.4:8080"; // backend ünvanınız
    const OFFICE_ID = "office_baku_01";                       // ofis identifikatoru
    const REFRESH_INTERVAL_MS = 15000;                        // 15 saniyə

    let qrCode = null;

    function renderQr(jsonString) {
        const container = document.getElementById("qr-container");
        container.innerHTML = ""; // köhnə QR-ı təmizlə
        qrCode = new QRCode(container, {
            text: jsonString,
            width: 320,
            height: 320,
            correctLevel: QRCode.CorrectLevel.M
        });
    }

    async function fetchAndRenderQr() {
        const statusEl = document.getElementById("status");
        try {
            const response = await fetch(
                `${API_BASE_URL}/api/qr/generate?officeId=${encodeURIComponent(OFFICE_ID)}`
            );

            if (!response.ok) {
                throw new Error(`Server xətası: ${response.status}`);
            }

            const payload = await response.json();
            // Backend-in QrPayloadResponse-una uyğun JSON-u birbaşa QR-a yazırıq
            renderQr(JSON.stringify(payload));

            statusEl.textContent = "Son yenilənmə: " + new Date().toLocaleTimeString("az-AZ");
            statusEl.classList.remove("error");
        } catch (err) {
            console.error(err);
            statusEl.textContent = "Xəta: server ilə əlaqə yoxdur";
            statusEl.classList.add("error");
        }
    }

    // İlk yükləmə
    fetchAndRenderQr();
    // Davamlı yenilənmə
    setInterval(fetchAndRenderQr, REFRESH_INTERVAL_MS);
</script>

</body>
</html>
