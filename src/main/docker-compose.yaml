services:
  postgres:
    image: postgres:16
    container_name: postgres-db
    restart: always
    environment:
      POSTGRES_USER: gpsroot
      POSTGRES_PASSWORD: gpsroot
      POSTGRES_DB: gpsrootdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_gpsroot:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: redis-gpsroot
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data_gpsroot:/data
    command: redis-server --save 60 1 --loglevel warning

  gpsroot:
    build: .
    container_name: gpsroot-app
    restart: always
    depends_on:
      - postgres
      - redis
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/gpsrootdb
      DATABASE_USERNAME: gpsroot
      DATABASE_PASSWORD: gpsroot
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
    ports:
      - "8080:8080"

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus-gpsroot
    restart: always
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    depends_on:
      - gpsroot

  grafana:
    image: grafana/grafana:latest
    container_name: grafana-gpsroot
    restart: always
    ports:
      - "3000:3000"
    volumes:
      - grafana_data_gpsroot:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  postgres_data_gpsroot:
  redis_data_gpsroot:
  grafana_data_gpsroot: