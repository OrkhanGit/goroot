services:
  postgres:
    image: postgres:16
    container_name: postgres-db
    restart: always
    environment:
      POSTGRES_USER: gpsroot
      POSTGRES_PASSWORD: gpsroot
      POSTGRES_DB: gpsrootdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_gpsroot:/var/lib/postgresql/data
volumes:
  postgres_data_gpsroot: