services:
  postgres:
    image: postgres:16
    container_name: postgres-db
    restart: always
    environment:
      POSTGRES_USER: gpsroot
      POSTGRES_PASSWORD: gpsroot
      POSTGRES_DB: gpsrootdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_gpsroot:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: redis-gpsroot
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data_gpsroot:/data
    command: redis-server --save 60 1 --loglevel warning

volumes:
  postgres_data_gpsroot:
  redis_data_gpsroot: